name: Publish to MCP Registry

# Fires when a version tag (e.g. v1.0.0) is pushed.
# Authentication is GitHub OIDC: the *repository's own identity* proves it
# belongs to the Composio org, so NO personal login and NO OAuth-app approval
# is needed. The only requirement is that this repo lives under the Composio org.
on:
  push:
    tags: ["v*"]

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false
  queue: max

env:
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
  SERVER_NAME: "io.github.ComposioHQ/composio"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail

          manifest_name="$(jq -er '.name' server.json)"
          manifest_version="$(jq -er '.version' server.json)"

          if [[ "$manifest_name" != "$SERVER_NAME" ]]; then
            echo "::error::server.json name must be $SERVER_NAME, got $manifest_name"
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "v$manifest_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match server.json version $manifest_version"
            exit 1
          fi

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail

          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" mcp-publisher
          install -m 0755 mcp-publisher "$RUNNER_TEMP/mcp-publisher"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate server manifest
        run: mcp-publisher validate

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail

          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" mcp-publisher
          install -m 0755 mcp-publisher "$RUNNER_TEMP/mcp-publisher"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Authenticate to MCP Registry (OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: mcp-publisher publish

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Verify published server
        shell: bash
        run: |
          set -euo pipefail

          encoded_name="$(jq -rn --arg s "$SERVER_NAME" '$s | @uri')"
          manifest_version="$(jq -er '.version' server.json)"
          encoded_version="$(jq -rn --arg s "$manifest_version" '$s | @uri')"
          registry_url="https://registry.modelcontextprotocol.io/v0.1/servers/${encoded_name}/versions/${encoded_version}"
          response=""

          for attempt in {1..12}; do
            if response="$(curl --fail --silent --show-error --location \
              --connect-timeout 5 --max-time 15 "$registry_url")"; then
              if jq -e --slurpfile expected server.json '
                .server == $expected[0] and
                ._meta["io.modelcontextprotocol.registry/official"].status == "active"
              ' <<< "$response" > /dev/null 2>&1; then
                echo "Verified exact active manifest for $SERVER_NAME at version $manifest_version"
                exit 0
              fi
            else
              echo "::warning::Registry request failed on attempt $attempt of 12"
            fi

            if (( attempt < 12 )); then
              sleep 5
            fi
          done

          echo "::error::Registry did not return server.json as the exact active manifest"
          if [[ -n "$response" ]]; then
            printf '%s' "$response" | jq -Rs '{response: .}'
          else
            echo "No response body received"
          fi
          exit 1
